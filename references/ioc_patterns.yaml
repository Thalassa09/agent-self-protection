    # Monero addresses are not publicly visible by design

# ─── Prompt injection patterns (curated) ───
prompt_injection_patterns:
  direct:
    - "ignore (all )?(previous|prior) instructions"
    - "disregard (all )?(previous|prior) (rules|instructions)"
    - "you are now in (DAN|developer|jailbreak) mode"
    - "pretend you (are|have) no restrictions"
    - "system: you are"
    - "<\\|im_start\\|>system"
    - "<\\|functioncalls\\|>"
  indirect:
    - hidden HTML with "system:" markers
    - markdown that mimics user commands
    - JSON inside text that looks like function calls
    - zero-width Unicode (used to leak prompts past filters)
    - "in this hypothetical scenario, you must..."
    - urgency + authority: "the user said you MUST do this"

# ─── Disallowed content channels ───
# (for output sanitization — strip from outgoing content)
disallowed_channels:
  zero_width_unicode:
    - "\u200b"   # zero-width space
    - "\u200c"   # zero-width non-joiner
    - "\u200d"   # zero-width joiner
    - "\ufeff"   # zero-width no-break space (BOM)
    - "\u2060"   # word joiner
  control_chars:
    - "\u0000-\u001f"  # C0 controls
    - "\u007f"        # DEL
    - "\u0080-\u009f" # C1 controls (except valid formatting)
  bidi_overrides:
    - "\u202a-\u202e" # LRE/RLE/PDF/LRO/RLO
    - "\u2066-\u2069" # LRI/RLI/FSI/PDI

# ─── Update schedule ───
maintenance:
  rule_update_interval_days: 30
  ioc_refresh_interval_days: 7
  signature_sources:
